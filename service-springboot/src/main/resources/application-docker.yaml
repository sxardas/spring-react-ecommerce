server:
  address: 0.0.0.0
  port: 8080


spring:
  datasource:
    url: jdbc:postgresql://${POSTGRESQL_HOST_SB}:5432/${POSTGRESQL_DATABASE_SB}
    username: ${POSTGRESQL_USERNAME_SB}
    password: ${POSTGRESQL_PASSWORD_SB}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  data:
    redis:
      host: ${REDIS_HOST_SB}
      port: 6379
      database: ${REDIS_DATABASE_SB}
      username: ${REDIS_USERNAME_SB}
      password: ${REDIS_PASSWORD_SB}

      connect-timeout: 2s
      timeout: 2s

      lettuce:
        pool:
          enabled: true
          max-active: 10
          max-idle: 10
          min-idle: 2
          max-wait: 2s
