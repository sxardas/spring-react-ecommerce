services:

  ### (Keycloak) PostgreSQL & Service ###
  service-postgres-kc:
    image: postgres:18-alpine
    container_name: service-postgres-kc
    environment:
      POSTGRES_DB: ${POSTGRESQL_DATABASE_KC}
      POSTGRES_USER: ${POSTGRESQL_USERNAME_KC}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD_KC}
    ports:
      - "5430:5432"
    networks:
      - ecommerce
    volumes:
      - postgres_kc_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRESQL_USERNAME_KC} -d ${POSTGRESQL_DATABASE_KC}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  service-keycloak:
    image: quay.io/keycloak/keycloak:26.8
    container_name: service-keycloak
    command: [ "start-dev" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${POSTGRESQL_HOST_KC}:5432/${POSTGRESQL_DATABASE_KC}
      KC_DB_USERNAME: ${POSTGRESQL_USERNAME_KC}
      KC_DB_PASSWORD: ${POSTGRESQL_PASSWORD_KC}
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8080:8080"
    networks:
      - ecommerce
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q '200 OK'" ]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    depends_on:
      service-postgres-kc:
        condition: service_healthy

  ### (Spring Boot) PostgreSQL & Redis & Service ###
  service-postgres-sb:
    image: postgres:18-alpine
    container_name: service-postgres-sb
    environment:
      POSTGRES_DB: ${POSTGRESQL_DATABASE_SB}
      POSTGRES_USER: ${POSTGRESQL_USERNAME_SB}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD_SB}
    ports:
      - "5431:5432"
    networks:
      - ecommerce
    volumes:
      - postgres_sb_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRESQL_USERNAME_SB} -d ${POSTGRESQL_DATABASE_SB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  service-redis-sb:
    image: redis:8.8.4-alpine
    container_name: service-redis-sb
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD_SB}",

      "--maxmemory", "256mb",
      "--maxmemory-policy", "allkeys-lru",

      "--appendonly", "yes",
      "--appendfsync", "everysec",

      "--save", "3600", "1", "300", "100", "60", "10000"
    ]
    ports:
      - "6371:6379"
    networks:
      - ecommerce
    volumes:
      - redis_sb_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD_SB}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  service-springboot:
    image: service-springboot
    build:
      context: ./service-springboot
    container_name: service-springboot
    environment:
      SPRING_PROFILES_ACTIVE: docker
      POSTGRESQL_HOST_SB: ${POSTGRESQL_HOST_SB}
      POSTGRESQL_DATABASE_SB: ${POSTGRESQL_DATABASE_SB}
      POSTGRESQL_USERNAME_SB: ${POSTGRESQL_USERNAME_SB}
      POSTGRESQL_PASSWORD_SB: ${POSTGRESQL_PASSWORD_SB}
      REDIS_HOST_SB: ${REDIS_HOST_SB}
      REDIS_DATABASE_SB: ${REDIS_DATABASE_SB}
      REDIS_USERNAME_SB: ${REDIS_USERNAME_SB}
      REDIS_PASSWORD_SB: ${REDIS_PASSWORD_SB}
    ports:
      - "8081:8080"
    networks:
      - ecommerce
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/actuator/health" ]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    depends_on:
      service-postgres-sb:
        condition: service_healthy
      service-redis-sb:
        condition: service_healthy
      service-keycloak:
        condition: service_healthy


networks:
  ecommerce:
    driver: bridge


volumes:
  postgres_kc_data:
  postgres_sb_data:
  redis_sb_data:
